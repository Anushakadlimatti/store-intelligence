[pytest]
testpaths = tests
pythonpath = .
addopts = --cov=app --cov-report=term-missing --cov-fail-under=70
filterwarnings =
    ignore::DeprecationWarning

[coverage:run]
source = app
omit =
    app/live_stream.py
    app/recent_events.py

[coverage:report]
exclude_lines =
    pragma: no cover
    if TYPE_CHECKING:
